# Corre en la MV de Ingesta. Los 3 son jobs de una sola pasada (Pull 100%), no servicios
# persistentes -> restart: "no". Se ejecutan con: docker compose -f docker-compose.ingest.yml up --build
version: "3.9"

services:
  ingest-mysql:
    build: ./ingest-mysql
    env_file: .env
    environment:
      MYSQL_HOST: ${DB_HOST}
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  ingest-mongodb:
    build: ./ingest-mongodb
    env_file: .env
    environment:
      MONGO_URI: mongodb://${DB_HOST}:27017/ms2_catalogo
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  ingest-postgres:
    build: ./ingest-postgres
    env_file: .env
    environment:
      PG_HOST: ${DB_HOST}
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
