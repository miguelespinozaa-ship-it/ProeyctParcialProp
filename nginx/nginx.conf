worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream ms1_upstream { server ms1:8081; }
    upstream ms2_upstream { server ms2:8082; }
    upstream ms3_upstream { server ms3:8083; }
    upstream ms4_upstream { server ms4:8084; }
    upstream ms5_upstream { server ms5:8085; }

    server {
        listen 80;

        location /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /ms1/ {
            proxy_pass http://ms1_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ms2/ {
            proxy_pass http://ms2_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # /swagger-ui.html redirige a /swagger-ui/index.html (ruta absoluta, sin el prefijo /ms2)
            proxy_redirect /swagger-ui/ /ms2/swagger-ui/;
            # springdoc genera configUrl/spec con el prefijo real si Spring honra X-Forwarded-Prefix
            # (requiere server.forward-headers-strategy: framework en application.yml)
            proxy_set_header X-Forwarded-Prefix /ms2;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ms3/ {
            proxy_pass http://ms3_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # /api-docs redirige a /api-docs/ (ruta absoluta, sin el prefijo /ms3)
            proxy_redirect /api-docs/ /ms3/api-docs/;
        }

        location /ms4/ {
            proxy_pass http://ms4_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ms5/ {
            proxy_pass http://ms5_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
