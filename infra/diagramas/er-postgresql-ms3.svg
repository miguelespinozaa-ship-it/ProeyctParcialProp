<text x="520.0" y="181.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle" xml:space="preserve">ON DELETE CASCADE</text>
<rect x="40" y="336" width="920" height="168" rx="8" fill="#FFFBE6" stroke="#D6B656" stroke-width="1.6"/>
<text x="52.0" y="361.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start" xml:space="preserve">Reglas del modelo</text>
<text x="52.0" y="377.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start" xml:space="preserve">• Un pedido tiene de 1 a N ítems (orders 1 : N order_items). Al crearse, MS3 valida cada plato contra MS2 y guarda</text>
<text x="52.0" y="394.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start" xml:space="preserve">  nombre y precio unitario como fotografía del momento de la compra.</text>
<text x="52.0" y="411.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start" xml:space="preserve">• status ∈ {PEDIDO, ENVIADO, ENTREGADO}: PEDIDO → ENVIADO (admin del restaurante) → ENTREGADO (repartidor asignado).</text>
<text x="52.0" y="428.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start" xml:space="preserve">• customer_id / delivery_id (MySQL) y restaurant_id (MongoDB) son referencias lógicas entre microservicios, sin FK.</text>
<text x="52.0" y="445.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start" xml:space="preserve">• Índices: idx_orders_customer, idx_orders_restaurant(restaurant_id, status), idx_orders_delivery, idx_order_items_order.</text>
<text x="52.0" y="462.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start" xml:space="preserve">• Carga masiva única con seed.js: 20,000+ pedidos con sus ítems.</text>
</svg>